name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: false
      - name: Format check
        shell: pwsh
        run: |
          $files = @(Get-ChildItem -Filter *.go -Recurse | ForEach-Object { $_.FullName })
          $unformatted = @(gofmt -l $files)
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($unformatted.Count -gt 0) {
            Write-Output '以下文件未通过 gofmt；格式差异如下：'
            $unformatted
            gofmt -d $unformatted
            exit 1
          }
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        env:
          CGO_ENABLED: '0'
          GOOS: windows
          GOARCH: amd64
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -ldflags="-s -w" -o dist/win-server-tool.exe .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $hash = (Get-FileHash dist/win-server-tool.exe -Algorithm SHA256).Hash.ToLower()
          "$hash  win-server-tool.exe" | Set-Content dist/SHA256SUMS.txt -Encoding utf8NoBOM
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: win-server-tool-${{ github.sha }}
          path: dist/
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: win-server-tool-${{ github.sha }}
          path: dist
      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/win-server-tool.exe
            dist/SHA256SUMS.txt
